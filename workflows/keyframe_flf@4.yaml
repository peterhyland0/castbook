# keyframe_flf@2 plus a framing check: a keyframe whose face would be under 64 px in an 832x480 clip is
# re-framed at the keyframe step (cheap) instead of being found unscorable at the clip step, and each shot's
# clip renders at 720p only if its keyframes' faces still predict too small at 480p.
id: keyframe_flf
version: 4
mode: keyframe_flf
steps:
  keyframe:
    model: qwen-image-edit-2511
    params:
      lightning: true
      width: 1248
      height: 720
    retry:
      max_attempts: 5          # keyframes are cheap (~$0.003), and framing retries come out of the same budget
      max_reprompts: 1
      reprompt_suffix: " The face is fully visible and turned toward the camera, no hands near the face."
      reprompt_by_cause:
        small: " Framed closer: head and shoulders fill the frame, the face large and sharp."
  end_keyframe:
    model: qwen-image-edit-2511
    params:
      lightning: true
      width: 1248
      height: 720
      # refs are [start keyframe, portrait]; Qwen-Image-Edit-Plus numbers them Picture 1 and Picture 2
      prompt_template: >-
        Picture 1 a few seconds later: {end} Keep the same location, camera angle, lighting and outfit as
        Picture 1, and the same face as Picture 2. Cinematic 16:9 still.
    retry:
      max_attempts: 5          # keyframes are cheap (~$0.003), and framing retries come out of the same budget
      max_reprompts: 1
      reprompt_suffix: " The face is fully visible and turned toward the camera, no hands near the face."
      reprompt_by_cause:
        small: " Framed closer: head and shoulders fill the frame, the face large and sharp."
  clip:
    model: wan2.2-i2v-a14b
    params:
      lightning: true
      width: 832
      height: 480
      num_frames: 81
      fps: 16
    retry:
      max_attempts: 2          # clips cost ~4x a keyframe, so fewer tries
      max_reprompts: 1
      reprompt_suffix: " Keep the face turned toward the camera throughout; hands stay away from the face."
      reprompt_by_cause:
        small: " The camera pushes in close; head and shoulders fill the frame and the face stays large and sharp."
  judge:
    sample_every: 4
    max_yaw: 45
    max_hand_overlap: 0.15
    min_face_px: 64            # narrower faces are unverifiable, not fail (provisional until M3 calibration)
    gate:
      metric: p10
      min_score: 0.5
      min_coverage: 0.5
  stitch:
    params:
      fps: 16
framing:
  min_clip_face_px: 64
  clip_sizes:                  # cheapest first: 720p clips cost ~3.6x (71 s vs 20 s warm on H100)
    - [832, 480]
    - [1248, 720]
