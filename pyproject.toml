[project]
name = "castbook"
version = "0.1.0"
description = "Identity-gated, versioned multi-model video pipelines on Modal"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"castbook/viewer.py" = ["E501"]  # HTML template lines

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
