# A 3-shot, 15-second script for golden character c01. Motion prompts keep the face toward camera,
# the lesson from the first single-shot run (a turn to the window made 76% of frames unscorable).
# `end` is where each shot finishes; only first-last-frame workflows (keyframe_flf) use it, and adding it
# doesn't change any other workflow's cache keys.
character: c01
seed: 11
shots:
  - id: s1
    keyframe: >-
      The same person from the reference image walking along a quiet city street at dawn, soft golden
      light, wide shot from the front, cinematic 16:9 still, same face, same hairstyle, same outfit.
    motion: >-
      The person walks slowly toward the camera, looking ahead with a calm expression, gentle tracking
      shot, morning light.
    end: >-
      The person has walked several steps closer and now fills a medium shot from the waist up, mid-stride,
      looking ahead with a calm expression, face clearly visible.
  - id: s2
    keyframe: >-
      The same person from the reference image ordering at a café counter, warm interior light, medium
      shot facing the camera, cinematic 16:9 still, same face, same hairstyle, same outfit.
    motion: >-
      The person smiles and nods at the barista just off camera, small natural head movement, steady
      camera, warm light.
    end: >-
      The person is smiling warmly just after a nod, head slightly tilted, still facing the camera at the
      counter.
  - id: s3
    keyframe: >-
      The same person from the reference image sitting by a café window holding a cup with both hands at
      chest height, soft window light, medium close-up facing the camera, cinematic 16:9 still, same face,
      same hairstyle, same outfit.
    motion: >-
      The person looks up from the cup toward the camera and smiles softly, slight camera push-in, rain
      on the window behind them.
    end: >-
      The person has looked up from the cup and smiles softly at the camera, cup still held at chest height,
      framed slightly closer.
